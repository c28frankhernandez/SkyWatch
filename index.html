<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skywatch · live flights and cameras</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--ink:#0e1621;--panel:rgba(14,22,33,.96);--line:#26364a;--tx:#e8eef6;--mu:#8b9db3;--ac:#5ec2ff;--bad:#ff8a7a;
 --ui:'Barlow',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--disp:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--tx);font:14px/1.4 var(--ui)}
#map{position:absolute;inset:0;background:var(--ink)}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:10px}
#bar{position:absolute;z-index:1000;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;max-width:820px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px}
#bar b{font:600 18px var(--disp);letter-spacing:.02em;margin-right:4px}
input[type=search],select,button,.chip{font:inherit;color:var(--tx);background:#16222f;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{width:190px}
button{cursor:pointer}button:hover,.chip:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.chip input{accent-color:var(--ac);margin:0}
.chip:has(input:checked){border-color:var(--ac)}
#st{flex:1;min-width:120px;text-align:right;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st.err{color:var(--bad)}
#st i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7be0a8;margin-right:6px}
#st.err i{background:var(--bad)}
#info{position:absolute;z-index:1000;right:10px;top:max(70px,calc(env(safe-area-inset-top) + 60px));width:290px;padding:14px}
#info[hidden]{display:none}
#ititle{font:600 28px/1 var(--disp);margin:0 0 2px}
#isub{color:var(--mu);margin-bottom:10px}
#irows div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}
#irows span{color:var(--mu)}
#iact{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
#iact a{color:var(--ac);align-self:center;margin-left:auto}
#x{position:absolute;top:8px;right:8px;padding:2px 8px;z-index:2}
#phf{margin:-14px -14px 12px;position:relative;overflow:hidden;border-radius:10px 10px 0 0}
#ph{display:block;width:100%;height:150px;object-fit:cover;background:#16222f}
#phc{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 5px;font-size:11px;color:#e8eef6;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--ui);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.ev svg{width:16px;height:16px;fill:#fff}
.evp{width:250px}.evp h4{margin:0 0 2px;font:600 16px var(--disp)}.evp small{display:block;color:#556;margin-bottom:6px}.evp a{display:block;margin:5px 0;color:#0b63c9;line-height:1.3}
.camp video{width:100%;border-radius:6px;display:block;background:#000}
.pm{background:none;border:0}
.pl{width:22px;height:22px;transition:transform .5s linear}
.pl svg{display:block;fill:currentColor;stroke:#0b1220;stroke-width:1.1;stroke-linejoin:round}
.pm.sel{z-index:9999!important}.pm.sel .pl svg{transform:scale(1.35);filter:drop-shadow(0 0 4px #ff9f1c)}
.camp{width:260px}.camp h4{margin:0 0 6px;font:600 16px var(--disp)}
.camp img{width:100%;min-height:120px;background:#16222f;border-radius:6px;display:block}
.camp small{color:#667;display:block;margin-top:4px}
.leaflet-popup-content{margin:12px}
#leg{position:absolute;z-index:1000;left:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:14px;padding:8px 12px}
#leg label{display:flex;gap:6px;align-items:center;cursor:pointer}
#leg input{accent-color:var(--ac);margin:0}
#leg i{width:11px;height:11px;border-radius:50%;border:1.5px solid #0b1220;outline:1px solid #8b9db3}
@media (max-width:640px){#info{top:auto;bottom:10px;left:10px;right:10px;width:auto}input[type=search]{width:130px}}
@media (prefers-reduced-motion:reduce){.pl{transition:none}}
</style>
</head>
<body>
<div id="map"></div>

<div id="bar" class="glass">
  <b>Skywatch</b>
  <input id="q" type="search" placeholder="Callsign, registration or hex" aria-label="Find an aircraft">
  <label class="chip"><input type="checkbox" id="fl" checked>Flights</label>
  <label class="chip"><input type="checkbox" id="tr">All trails</label>
  <label class="chip"><input type="checkbox" id="cm">Cameras</label>
  <label class="chip"><input type="checkbox" id="ev">Events</label>
  <button id="wk" title="Add worldwide webcams from Windy (free API key)">Windy key</button>
  <select id="flt" aria-label="Aircraft filter">
    <option value="all">All aircraft</option><option value="air">Airborne only</option>
  </select>
  <button id="loc" title="Center on my location">Locate me</button>
  <span id="st" role="status"><i></i>Starting…</span>
</div>

<div id="leg" class="glass">
  <label><input type="checkbox" id="c-com" checked><i style="background:#3b8cff"></i>Commercial</label>
  <label><input type="checkbox" id="c-pri" checked><i style="background:#fff"></i>Private</label>
  <label><input type="checkbox" id="c-mil" checked><i style="background:#ff3b3b"></i>Military</label>
</div>

<aside id="info" class="glass" hidden>
  <button id="x" aria-label="Close">×</button>
  <figure id="phf" hidden style="margin-top:-14px"><img id="ph" alt=""><figcaption id="phc"></figcaption></figure>
  <h2 id="ititle"></h2>
  <div id="isub">Live from ADS-B</div>
  <div id="irows"></div>
  <div id="iact">
    <button id="fol">Follow</button>
    <button id="fit" hidden>Show route</button>
    <a id="fa" target="_blank" rel="noopener">FlightAware</a>
  </div>
</aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Map ---------- */
const map = L.map('map', {zoomControl:false, worldCopyJump:true, minZoom:3}).setView([40, -95], 6);
const esri = p => `https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
const dark = L.layerGroup([
  L.tileLayer(esri('Canvas/World_Dark_Gray_Base'), {maxZoom:18, maxNativeZoom:16, attribution:'Tiles © Esri, HERE, Garmin, OpenStreetMap contributors'}),
  L.tileLayer(esri('Canvas/World_Dark_Gray_Reference'), {maxZoom:18, maxNativeZoom:16})
]).addTo(map);
const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap contributors'});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:18, attribution:'Imagery © Esri'});
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.layers({Dark:dark, Streets:streets, Satellite:sat}, null, {position:'bottomright'}).addTo(map);
const flLayer = L.layerGroup().addTo(map), trLayer = L.layerGroup().addTo(map), camLayer = L.layerGroup();
const canvas = L.canvas({padding:.5});

function setStatus(msg, err){ const s = $('#st'); s.className = err ? 'err' : ''; s.title = msg; s.innerHTML = '<i></i>' + esc(msg); }

/* ---------- Flights ---------- */
const PLANE = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
const planes = new Map();
const RELAY = new URLSearchParams(location.search).get('relay') || 'https://black-dust-e670.frank0501hernandez.workers.dev';   // optional: ?relay=https://your-worker.workers.dev
const via = u => RELAY ? RELAY.replace(/\/$/, '') + '/?u=' + encodeURIComponent(u) : u;
let sel = null, follow = false, tick = 0, busy = false, lastPull = 0;
const altOf = a => a.alt_baro === 'ground' ? 0 : (+a.alt_baro || 0);
const BIZ = new Set('C25A C25B C25C C510 C525 C550 C560 C56X C650 C680 C68A C700 C750 CL30 CL35 CL60 E50P E55P F2TH F900 FA50 FA7X FA8X GL5T GL7T GLEX GLF4 GLF5 GLF6 H25B LJ35 LJ45 LJ60 PC12 PC24 SF50 BE20 BE40 B350 TBM8 TBM9'.split(' '));
const CATS = {com:['Commercial', '#3b8cff'], pri:['Private', '#ffffff'], mil:['Military', '#ff3b3b']};
const catOf = a => (a.dbFlags & 1) ? 'mil'
  : (/^[A-Z]{3}\d{1,4}[A-Z]{0,2}$/.test((a.flight || '').trim()) && !BIZ.has(a.t) && !['A1', 'A2', 'A7'].includes(a.category)) ? 'com' : 'pri';
const colorOf = a => CATS[catOf(a)][1];
const pass = a => $('#c-' + catOf(a)).checked && ($('#flt').value === 'all' || a.alt_baro !== 'ground');

function upsert(a, force){
  if (a.lat == null || a.lon == null) return;
  if (!force && a.hex !== sel && !pass(a)) return;
  let p = planes.get(a.hex);
  if (!p){
    const m = L.marker([a.lat, a.lon], {
      icon: L.divIcon({className:'pm', html:`<div class="pl">${PLANE}</div>`, iconSize:[22,22], iconAnchor:[11,11]}),
      keyboard:false
    }).on('click', () => select(a.hex));
    p = {m, trail:[], line:L.polyline([], {weight:1.6, opacity:.75})};
    planes.set(a.hex, p);
    flLayer.addLayer(m);
  }
  p.d = a; p.seen = tick; p.t0 = Date.now() - (a.seen_pos || 0) * 1000; p.cat = catOf(a);
  const ll = [a.lat, a.lon], last = p.trail[p.trail.length - 1];
  if (!last || last[0] !== ll[0] || last[1] !== ll[1]){ p.trail.push(ll); if (p.trail.length > 90) p.trail.shift(); }
  p.m.setLatLng(ll);
  const root = p.m.getElement();
  if (root){
    const el = root.firstChild;
    el.style.color = colorOf(a);
    el.style.transform = `rotate(${a.track ?? 0}deg)`;
    el.style.opacity = a.alt_baro === 'ground' ? .5 : 1;
    root.classList.toggle('sel', a.hex === sel);
  }
  drawTrail(p, a.hex);
}
function drawTrail(p, hex){
  const routed = hex === sel && routeFor(p);
  if ($('#tr').checked || (hex === sel && !routed)){
    p.line.setLatLngs(p.trail).setStyle({color: p.cat === 'pri' ? '#7d8fa3' : colorOf(p.d)});
    if (!trLayer.hasLayer(p.line)) trLayer.addLayer(p.line);
  } else trLayer.removeLayer(p.line);
}
function sweep(){
  for (const [h, p] of planes) if (p.seen !== tick && h !== sel){ flLayer.removeLayer(p.m); trLayer.removeLayer(p.line); planes.delete(h); }
}

const wrapLon = x => ((x + 540) % 360) - 180;
function viewPoints(){
  const b = map.getBounds(), c = b.getCenter(), need = map.distance(c, b.getNorthEast()) / 1852;   // nautical miles
  if (need <= 250) return [[c.lat, wrapLon(c.lng), Math.ceil(need)]];
  const pts = [];
  for (const fy of [.25, .75]) for (const fx of [.25, .75])
    pts.push([b.getSouth() + (b.getNorth() - b.getSouth()) * fy, wrapLon(b.getWest() + (b.getEast() - b.getWest()) * fx), 250]);
  return pts;
}
async function opensky(){
  const b = map.getBounds(), cl = (v, m) => Math.max(-m, Math.min(m, v));
  const r = await fetch(via(`https://opensky-network.org/api/states/all?lamin=${cl(b.getSouth(),90)}&lomin=${cl(b.getWest(),180)}&lamax=${cl(b.getNorth(),90)}&lomax=${cl(b.getEast(),180)}`));
  if (!r.ok) throw 0;
  return ((await r.json()).states || []).map(s => ({hex:s[0], flight:s[1], lon:s[5], lat:s[6],
    alt_baro: s[8] ? 'ground' : (s[7] == null ? 0 : s[7] * 3.28084), gs:s[9] * 1.944, track:s[10], baro_rate:s[11] * 196.85, squawk:s[14]}));
}
const fetchOne = async (kind, val) => {
  const r = await fetch(via(`https://api.adsb.lol/v2/${kind}/${encodeURIComponent(val)}`));
  if (!r.ok) throw 0;
  return ((await r.json()).ac || [])[0];
};

async function pull(){
  if (busy || !$('#fl').checked) return;
  if (map.getZoom() < 4) return setStatus('Zoom in to load aircraft');
  busy = true; lastPull = Date.now();
  try {
    let list = [], src = '', why = [];
    for (const [name, base] of FEEDS){
      const res = await Promise.allSettled(viewPoints().map(([la, lo, r]) =>
        fetch(via(`${base}/${la.toFixed(3)}/${lo.toFixed(3)}/${r}`)).then(x => { if (!x.ok) throw new Error('HTTP ' + x.status); return x.json(); })));
      const ok = res.filter(x => x.status === 'fulfilled');
      if (ok.length){ ok.forEach(x => list.push(...(x.value.ac || []))); src = name; break; }
      why.push(name + ': ' + (res[0].reason?.message || 'blocked'));
    }
    if (!src){
      try { list = await opensky(); src = 'OpenSky'; }
      catch (e) { why.push('OpenSky: ' + (e?.message || 'blocked')); throw new Error(why.join(' · ')); }
    }
    tick++; list.forEach(a => upsert(a)); sweep();
    if (sel && planes.get(sel)?.seen !== tick){ try { const a = await fetchOne('hex', sel); if (a) upsert(a, true); } catch {} }
    if (follow && planes.get(sel)) map.panTo(planes.get(sel).m.getLatLng());
    renderInfo(); drawRoute();
    setStatus(`Live · ${planes.size.toLocaleString()} aircraft · ${src} · ${new Date().toLocaleTimeString()}`);
  } catch (e) { setStatus('Flight data unreachable (' + (e?.message || 'unknown') + '). If you opened this from your computer, try hosting it (for example on GitHub Pages) instead.', true); }
  busy = false;
}
const FEEDS = [['adsb.lol', 'https://api.adsb.lol/v2/point'], ['airplanes.live', 'https://api.airplanes.live/v2/point']];

/* ---------- Route of the selected aircraft ---------- */
const routes = new Map(), pending = new Set(), routeLayer = L.layerGroup().addTo(map);
const hav = (a, b) => { const R = Math.PI / 180, h = Math.sin((b[0] - a[0]) * R / 2) ** 2 + Math.cos(a[0] * R) * Math.cos(b[0] * R) * Math.sin((b[1] - a[1]) * R / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };   // km
const brg = (a, b) => { const R = Math.PI / 180, dl = (b[1] - a[1]) * R;
  return (Math.atan2(Math.sin(dl) * Math.cos(b[0] * R), Math.cos(a[0] * R) * Math.sin(b[0] * R) - Math.sin(a[0] * R) * Math.cos(b[0] * R) * Math.cos(dl)) / R + 360) % 360; };
// Callsign databases reuse flight numbers, so only trust a route if the aircraft's position and heading actually fit it.
function routeFor(p){
  const r = routes.get((p.d.flight || '').trim());
  if (!r || r.o?.latitude == null || r.d?.latitude == null) return null;
  const me = [p.d.lat, p.d.lon], o = [r.o.latitude, r.o.longitude], d = [r.d.latitude, r.d.longitude];
  const D = hav(o, d), d1 = hav(o, me), d2 = hav(me, d);
  if (d1 + d2 > D * 1.25 + 150) return null;
  if (p.d.alt_baro !== 'ground' && p.d.gs > 100 && p.d.track != null && d2 > 100 && Math.abs(((brg(me, d) - p.d.track + 540) % 360) - 180) > 75) return null;
  return r;
}
const ahead = (ll, trk, km) => { const R = Math.PI / 180, d = km / 6371, b = trk * R, la = ll[0] * R, lo = ll[1] * R;
  const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(b));
  return [la2 / R, (lo + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2))) / R]; };
function arc(a, b, n = 48){
  const R = Math.PI / 180, la1 = a[0] * R, lo1 = a[1] * R, la2 = b[0] * R, lo2 = b[1] * R;
  const d = 2 * Math.asin(Math.sqrt(Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2));
  if (!d) return [a, b];
  const pts = []; let prev = a[1];
  for (let i = 0; i <= n; i++){
    const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
    const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
    const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
    const z = A * Math.sin(la1) + B * Math.sin(la2);
    let lon = Math.atan2(y, x) / R;
    while (lon - prev > 180) lon -= 360;
    while (lon - prev < -180) lon += 360;
    prev = lon; pts.push([Math.atan2(z, Math.hypot(x, y)) / R, lon]);
  }
  return pts;
}
async function viaRouteset(p, cs){   // adsb.lol checks the callsign against the aircraft's position
  try {
    const r = await fetch(via('https://api.adsb.lol/api/0/routeset'), {method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({planes:[{callsign:cs, lat:p.d.lat, lng:p.d.lon}]})});
    if (!r.ok) return null;
    const e = (await r.json())?.[0];
    const ap = (e?._airports || []).map(x => ({latitude:x.lat, longitude:x.lon, iata_code:x.iata, icao_code:x.icao, municipality:x.location || x.name}));
    if (!e || e.plausible === false || ap.length < 2) return null;
    const me = [p.d.lat, p.d.lon]; let best = null, bd = Infinity;
    for (let i = 0; i < ap.length - 1; i++){
      const o = [ap[i].latitude, ap[i].longitude], d = [ap[i + 1].latitude, ap[i + 1].longitude], x = hav(o, me) + hav(me, d) - hav(o, d);
      if (x < bd){ bd = x; best = {o:ap[i], d:ap[i + 1]}; }
    }
    return best;
  } catch { return null; }
}
async function loadRoute(){
  const p = planes.get(sel), cs = (p?.d.flight || '').trim();
  if (!cs || routes.has(cs) || pending.has(cs)) return drawRoute();
  pending.add(cs);
  let rt = await viaRouteset(p, cs);
  if (!rt){
    const url = 'https://api.adsbdb.com/v0/callsign/' + encodeURIComponent(cs);
    for (const u of [url, via(url)]){ try { const fr = (await (await fetch(u)).json()).response?.flightroute; rt = fr ? {o:fr.origin, d:fr.destination} : false; break; } catch {} }
  }
  pending.delete(cs);
  if (rt !== null) routes.set(cs, rt);
  drawRoute(); renderInfo();
}
function drawRoute(){
  routeLayer.clearLayers();
  const p = planes.get(sel), r = p && routeFor(p);
  if (!r){
    if (p && p.d.alt_baro !== 'ground' && p.d.track != null){ const me = [p.d.lat, p.d.lon];
      L.polyline(arc(me, ahead(me, p.d.track, 800)), {color:'#9fb3c8', weight:2, opacity:.9, dashArray:'4 8'}).addTo(routeLayer); }
    return;
  }
  const me = [p.d.lat, p.d.lon], o = [r.o.latitude, r.o.longitude], d = [r.d.latitude, r.d.longitude];
  L.polyline(arc(o, me), {color:'#ff9f1c', weight:3, opacity:.95}).addTo(routeLayer);                              // where it came from
  L.polyline(arc(me, d), {color:'#ff9f1c', weight:3, opacity:.85, dashArray:'2 9', lineCap:'round'}).addTo(routeLayer);   // where it's going
  [[o, r.o], [d, r.d]].forEach(([ll, ap]) => L.circleMarker(ll, {radius:6, color:'#0b1220', weight:2, fillColor:'#ff9f1c', fillOpacity:1})
    .bindTooltip(`${ap.iata_code || ap.icao_code} · ${ap.municipality}`, {permanent:true, direction:'top', offset:[0, -6]}).addTo(routeLayer));
}
$('#fit').onclick = () => {
  const p = planes.get(sel), r = p && routeFor(p);
  if (r) map.fitBounds([[r.o.latitude, r.o.longitude], [r.d.latitude, r.d.longitude], [p.d.lat, p.d.lon]], {paddingTopLeft:[40, 90], paddingBottomRight:[330, 60], maxZoom:9});
};
// glide aircraft between data updates using speed and heading
setInterval(() => {
  if (planes.size > 800) return;
  const now = Date.now();
  for (const p of planes.values()){
    const a = p.d;
    if (a.alt_baro === 'ground' || !(a.gs > 30) || a.track == null) continue;
    const m = a.gs * 0.514444 * Math.min((now - p.t0) / 1000, 30), t = a.track * Math.PI / 180;
    p.m.setLatLng([a.lat + m * Math.cos(t) / 111320, a.lon + m * Math.sin(t) / (111320 * Math.cos(a.lat * Math.PI / 180))]);
  }
}, 1000);

/* ---------- Aircraft photo (Wikipedia) ---------- */
const photos = new Map(), TYPE_NAMES = {};
[['Boeing 737 Next Generation', 'B736 B737 B738 B739'], ['Boeing 737 MAX', 'B37M B38M B39M B3XM'], ['Airbus A320 family', 'A318 A319 A320 A321 A19N A20N A21N'],
 ['Boeing 777', 'B772 B773 B77L B77W'], ['Boeing 787 Dreamliner', 'B788 B789 B78X'], ['Boeing 767', 'B762 B763 B764'], ['Boeing 757', 'B752 B753'],
 ['Boeing 747', 'B744 B748'], ['Airbus A330', 'A332 A333 A338 A339'], ['Airbus A350', 'A359 A35K'], ['Embraer E-Jet family', 'E170 E75L E75S E190 E195'],
 ['Bombardier CRJ700 series', 'CRJ7 CRJ9 CRJX'], ['Sikorsky UH-60 Black Hawk', 'H60'], ['Boeing AH-64 Apache', 'H64'], ['Boeing CH-47 Chinook', 'H47'],
 ['Bell Boeing V-22 Osprey', 'V22'], ['Lockheed C-130 Hercules', 'C130 C30J'], ['Boeing C-17 Globemaster III', 'C17'], ['Boeing KC-135 Stratotanker', 'K35R K35E'],
 ['McDonnell Douglas KC-10 Extender', 'KC10'], ['Boeing B-52 Stratofortress', 'B52'], ['General Dynamics F-16 Fighting Falcon', 'F16'],
 ['Lockheed Martin F-35 Lightning II', 'F35'], ['Boeing P-8 Poseidon', 'P8'], ['Boeing E-3 Sentry', 'E3TF E3CF'], ['Northrop T-38 Talon', 'T38']]
  .forEach(([n, codes]) => codes.split(' ').forEach(c => TYPE_NAMES[c] = n));
$('#ph').onerror = () => { $('#phf').hidden = true; };
async function loadPhoto(){
  const a = planes.get(sel)?.d, want = sel;
  $('#phf').hidden = true;
  if (!a || !(a.t || a.desc)) return;
  const key = a.t || a.desc;
  if (!photos.has(key)){
    const q = TYPE_NAMES[a.t] || ((a.desc || a.t) + ' aircraft').replace(/\b([A-Za-z])-(\d)/g, '$1$2');
    let hit = false;
    try {
      const j = await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&generator=search&gsrlimit=5&gsrsearch=${encodeURIComponent(q)}&prop=pageimages&piprop=thumbnail&pithumbsize=640`)).json();
      const pg = Object.values(j.query?.pages || {}).filter(x => x.thumbnail).sort((x, y) => x.index - y.index)[0];
      if (pg) hit = {src:pg.thumbnail.source, title:pg.title};
    } catch { return; }
    photos.set(key, hit);
  }
  const ph = photos.get(key);
  if (!ph || sel !== want) return;
  $('#ph').src = ph.src; $('#ph').alt = ph.title;
  $('#phc').textContent = ph.title + ' · Wikipedia';
  $('#phf').hidden = false;
}

/* ---------- Aircraft panel ---------- */
function select(hex){
  const prev = sel; sel = hex; follow = false; $('#fol').textContent = 'Follow';
  [prev, hex].forEach(h => { const p = planes.get(h); if (p){ p.m.getElement()?.classList.toggle('sel', h === sel); drawTrail(p, h); } });
  history.replaceState(null, '', hex ? '#flight=' + hex : location.pathname + location.search);
  routeLayer.clearLayers(); renderInfo(); if (hex){ loadRoute(); loadPhoto(); }
}
function renderInfo(){
  const p = planes.get(sel), box = $('#info');
  if (!p){ box.hidden = true; return; }
  const a = p.d, call = (a.flight || '').trim();
  box.hidden = false;
  $('#ititle').textContent = call || a.hex.toUpperCase();
  const rows = [
    ['Registration', a.r], ['Aircraft type', a.t],
    ['Altitude', a.alt_baro === 'ground' ? 'On ground' : Math.round(altOf(a)).toLocaleString() + ' ft'],
    ['Ground speed', a.gs != null ? Math.round(a.gs) + ' kt' : null],
    ['Heading', a.track != null ? Math.round(a.track) + '°' : null],
    ['Vertical rate', a.baro_rate != null ? Math.round(a.baro_rate).toLocaleString() + ' ft/min' : null],
    ['Squawk', a.squawk], ['ICAO hex', a.hex]
  ];
  const cs = (a.flight || '').trim(), raw = routes.get(cs), rt = routeFor(p), ap = x => `${x.municipality} (${x.iata_code || x.icao_code})`;
  $('#isub').textContent = CATS[p.cat || catOf(a)][0] + ' · ' + (rt ? `${ap(rt.o)} → ${ap(rt.d)}` : (raw === false || !cs) ? 'No route on file · dashed line shows current heading' : raw ? 'Route on file doesn’t fit this flight · dashed line shows current heading' : 'Looking up route…');
  $('#fit').hidden = !rt;
  $('#irows').innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><b>${esc(v || '—')}</b></div>`).join('');
  $('#fa').href = 'https://flightaware.com/live/flight/' + encodeURIComponent(call || a.hex);
}
function go(hex){ select(hex); const p = planes.get(hex); if (p) map.flyTo(p.m.getLatLng(), Math.max(map.getZoom(), 8)); }

$('#x').onclick = () => select(null);
$('#fol').onclick = () => { follow = !follow; $('#fol').textContent = follow ? 'Following' : 'Follow'; if (follow && planes.get(sel)) map.panTo(planes.get(sel).m.getLatLng()); };
$('#q').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim(); if (!v) return;
  const lv = v.toLowerCase();
  for (const [h, p] of planes) if (h === lv || (p.d.flight || '').trim().toLowerCase() === lv || (p.d.r || '').toLowerCase() === lv) return go(h);
  setStatus('Searching worldwide…');
  for (const [kind, val] of [['callsign', v.toUpperCase()], ['reg', v.toUpperCase()], ['hex', lv]]){
    try { const a = await fetchOne(kind, val); if (a){ upsert(a, true); return go(a.hex); } } catch {}
  }
  setStatus(`No aircraft found for “${v}”`, true);
});
const refilter = () => {
  for (const [h, p] of planes) if (h !== sel && !pass(p.d)){ flLayer.removeLayer(p.m); trLayer.removeLayer(p.line); planes.delete(h); }
  pull();
};
$('#flt').onchange = refilter;
document.querySelectorAll('#leg input').forEach(i => i.onchange = refilter);
$('#tr').onchange = () => planes.forEach((p, h) => drawTrail(p, h));
$('#fl').onchange = e => {
  if (e.target.checked){ map.addLayer(flLayer); map.addLayer(trLayer); pull(); }
  else { map.removeLayer(flLayer); map.removeLayer(trLayer); setStatus('Flights hidden'); }
};
$('#loc').onclick = () => navigator.geolocation?.getCurrentPosition(
  pos => map.setView([pos.coords.latitude, pos.coords.longitude], 8),
  () => setStatus('Location permission denied', true));

/* ---------- Cameras ----------
   Add more feeds by pushing another source: a list of JSON urls plus a parse() that returns
   [{lat, lon, name, img}] where img is a still-image URL that updates over time. */
const CAM_SOURCES = [{
  name: 'Caltrans (California)',
  urls: Array.from({length:12}, (_, i) => `https://cwwp2.dot.ca.gov/data/d${i + 1}/cctv/cctvStatusD${String(i + 1).padStart(2, '0')}.json`),
  parse: j => (j.data || []).map(o => o.cctv)
    .filter(c => c && c.inService !== 'false' && c.imageData?.static?.currentImageURL)
    .map(c => ({lat:+c.location.latitude, lon:+c.location.longitude, name:c.location.locationName || 'Traffic camera', img:c.imageData.static.currentImageURL, stream:c.imageData.streamingVideoURL}))
}, {
  name: 'TfL JamCams (London)',
  urls: ['https://api.tfl.gov.uk/Place/Type/JamCam'],
  parse: j => j.map(c => {
    const p = k => (c.additionalProperties || []).find(x => x.key === k)?.value;
    return p('available') === 'false' || !p('imageUrl') ? null : {lat:c.lat, lon:c.lon, name:c.commonName, img:p('imageUrl'), stream:p('videoUrl')};
  }).filter(Boolean)
}, {
  name: 'LTA (Singapore)',
  urls: ['https://api.data.gov.sg/v1/transport/traffic-images'],
  parse: j => (j.items?.[0]?.cameras || []).map(c => ({lat:c.location.latitude, lon:c.location.longitude, name:'Camera ' + c.camera_id, img:c.image}))
}, {
  name: 'NYC DOT (New York)',
  urls: ['https://webcams.nyctmc.org/api/cameras'],
  parse: j => j.filter(c => c.isOnline !== false && c.isOnline !== 'false')
    .map(c => ({lat:+c.latitude, lon:+c.longitude, name:c.name || 'NYC camera', img:c.imageUrl || `https://webcams.nyctmc.org/api/cameras/${c.id}/image`}))
}];
const bust = u => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();
let camsLoaded = false, camTimer;

let hlsInst = null;
const loadHls = () => window.Hls ? Promise.resolve(window.Hls) : new Promise((ok, no) => {
  const t = document.createElement('script'); t.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js';
  t.onload = () => ok(window.Hls); t.onerror = no; document.head.append(t);
});
function camPopup(c, src){
  const d = document.createElement('div'); d.className = 'camp';
  const h = document.createElement('h4'); h.textContent = c.name;
  const im = new Image(); im.dataset.base = c.img; im.dataset.nobust = c.nobust ? '1' : ''; im.alt = c.name;
  im.onerror = () => { im.alt = 'This camera is offline right now'; };
  const s = document.createElement('small');
  const snap = () => { im.src = c.nobust ? c.img : bust(c.img); s.textContent = src + (c.nobust ? ' · preview image' : ' · snapshot, rechecked every 10 s (the camera itself updates every 1–5 min)'); };
  d.append(h);
  if (/^https?:/.test(c.stream || '')){
    const v = document.createElement('video'); Object.assign(v, {muted:true, autoplay:true, playsInline:true, controls:true, loop:true});
    const fall = () => { if (v.isConnected){ v.replaceWith(im); snap(); } };
    v.onerror = fall; d.append(v); s.textContent = src + ' · live video (falls back to a snapshot if unavailable)';
    if (!/\.m3u8/.test(c.stream)) v.src = c.stream;
    else if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = c.stream;
    else loadHls().then(H => {
      if (!H?.isSupported()) return fall();
      hlsInst = new H(); hlsInst.loadSource(c.stream); hlsInst.attachMedia(v);
      hlsInst.on(H.Events.ERROR, (_, e) => { if (e.fatal) fall(); });
    }).catch(fall);
  } else { d.append(im); snap(); }
  d.append(s); return d;
}
async function loadCams(){
  if (camsLoaded) return; camsLoaded = true; let n = 0; const got = {};
  setStatus('Loading cameras…');
  await Promise.all(CAM_SOURCES.flatMap(s => s.urls.map(u =>
    fetch(u).then(r => r.json()).then(j => s.parse(j).forEach(c => {
      if (!isFinite(c.lat) || !isFinite(c.lon)) return; n++; got[s.name] = (got[s.name] || 0) + 1;
      L.circleMarker([c.lat, c.lon], {renderer:canvas, radius:5, color:'#0e1621', weight:1, fillColor:'#5ec2ff', fillOpacity:.9})
        .bindPopup(() => camPopup(c, s.name)).addTo(camLayer);
    })).catch(() => {}))));
  if (n) setStatus(`${n.toLocaleString()} cameras (${Object.entries(got).map(([k, v]) => k.split(' ')[0] + ' ' + v).join(', ')}) · zoom in past city level to see them`);
  else { camsLoaded = false; setStatus('Cameras could not be loaded (feed blocked or offline)', true); }
}
const syncCams = () => { const on = $('#cm').checked && map.getZoom() >= 8; [camLayer, winLayer].forEach(l => on ? map.addLayer(l) : map.removeLayer(l)); if (on) loadWindy(); };
$('#cm').onchange = e => { if (e.target.checked) loadCams(); syncCams(); };
map.on('zoomend', syncCams);
map.on('popupopen', e => {
  clearInterval(camTimer);
  const im = e.popup.getElement().querySelector('img[data-base]');
  if (im) camTimer = setInterval(() => { if (!im.dataset.nobust) im.src = bust(im.dataset.base); }, 10000);
});
map.on('popupclose', () => { clearInterval(camTimer); hlsInst?.destroy(); hlsInst = null; });

/* ---------- Windy webcams (worldwide; needs a free key) ---------- */
const winLayer = L.layerGroup();
const wkey = () => { try { return localStorage.getItem('windyKey') || ''; } catch { return ''; } };
let winBusy = false, winTimer;
async function getJSON(u, init){ for (const f of [u, via(u)]){ try { const r = await fetch(f, init); if (r.ok) return await r.json(); } catch {} } return null; }
async function loadWindy(){
  const key = wkey();
  if (!key || !$('#cm').checked || winBusy || map.getZoom() < 8) return;
  winBusy = true;
  const b = map.getBounds(), c = map.getCenter(), km = Math.min(250, Math.ceil(hav([c.lat, c.lng], [b.getNorth(), b.getEast()])));
  let err = '', all = [];
  try {
    for (const off of [0, 50]){
      const u = `https://api.windy.com/webcams/api/v3/webcams?nearby=${c.lat.toFixed(4)},${wrapLon(c.lng).toFixed(4)},${km}&limit=50&offset=${off}&include=location,images,urls`;
      let j = null;
      for (const f of [u, via(u)]){
        try {
          const r = await fetch(f, {headers:{'x-windy-api-key':key}});
          if (r.ok){ j = await r.json(); break; }
          err = 'HTTP ' + r.status + (r.status === 401 ? ' (key rejected, wrong key type, or not active yet)' : r.status === 403 ? ' (the Cloudflare relay needs the updated code)' : '');
        } catch { err = err || 'request blocked'; }
      }
      if (!j) break;
      all.push(...(j.webcams || []));
      if ((j.webcams || []).length < 50) break;
    }
  } finally { winBusy = false; }
  if (!all.length) return setStatus(err ? 'Windy webcams: ' + err : 'No Windy webcams found near here', !!err);
  winLayer.clearLayers();
  all.forEach(w => {
    const lat = w.location?.latitude, lon = w.location?.longitude, img = w.images?.current?.preview || w.images?.current?.thumbnail;
    if (lat == null || lon == null) return;
    L.circleMarker([lat, lon], {renderer:canvas, radius:5, color:'#0e1621', weight:1, fillColor:'#ffb703', fillOpacity:.95})
      .bindPopup(() => camPopup({name:w.title || 'Webcam', img, nobust:true}, 'Windy webcams'), {minWidth:260}).addTo(winLayer);
  });
  setStatus(`${winLayer.getLayers().length} Windy webcams near the center of the map`);
}
$('#wk').onclick = () => {
  const k = prompt('Paste your free Windy Webcams API key (get one at api.windy.com/keys). Leave it empty to remove it.', wkey());
  if (k === null) return;
  try { localStorage.setItem('windyKey', k.trim()); } catch {}
  $('#cm').checked = true; $('#cm').onchange({target:$('#cm')});
};
map.on('moveend', () => { clearTimeout(winTimer); winTimer = setTimeout(loadWindy, 900); });

/* ---------- Live events: earthquakes, natural hazards, news ---------- */
const evLayer = L.layerGroup();
const GUN = '<svg viewBox="0 0 24 24"><path d="M2 7h18v4h-3l-.7 2.5h-3.6V11H10l-1.3 7H5.6L7 11H2z"/></svg>';
const EONET = {wildfires:['#ff6a00', '🔥'], severeStorms:['#5b5bd6', '🌀'], volcanoes:['#c0392b', '🌋'], floods:['#1e88e5', '🌊']};
const evIcon = (bg, inner) => L.divIcon({className:'', html:`<div class="ev" style="background:${bg}">${inner}</div>`, iconSize:[28, 28], iconAnchor:[14, 14], popupAnchor:[0, -14]});
function evMarker(ll, icon, title, sub, links){
  return L.marker(ll, {icon, zIndexOffset:1000}).bindPopup(() => {
    const d = document.createElement('div'); d.className = 'evp';
    const h = document.createElement('h4'); h.textContent = title;
    const m = document.createElement('small'); m.textContent = sub;
    d.append(h, m);
    links.filter(l => /^https?:\/\//.test(l.href || '')).slice(0, 5).forEach(l => {
      const a = document.createElement('a'); a.href = l.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = l.text || new URL(l.href).hostname; d.append(a);
    });
    return d;
  }, {maxWidth:300});
}
const centre = g => g.type === 'Point' ? g.coordinates : (() => { const r = g.coordinates?.[0] || []; return r.length ? [r.reduce((t, c) => t + c[0], 0) / r.length, r.reduce((t, c) => t + c[1], 0) / r.length] : null; })();
async function gdelt(q, icon, label, buf){
  const j = await getJSON(`https://api.gdeltproject.org/api/v2/geo/geo?query=${encodeURIComponent(q + ' sourcelang:english')}&mode=PointData&format=GeoJSON&timespan=24h`);
  (j?.features || []).forEach(f => {
    const c = f.geometry?.coordinates; if (!c) return;
    const doc = new DOMParser().parseFromString(f.properties?.html || '', 'text/html');
    const links = [...doc.querySelectorAll('a[href]')].map(a => ({href:a.href, text:(a.getAttribute('title') || a.textContent || '').trim()}));
    buf.push(evMarker([c[1], c[0]], icon, f.properties?.name || label, `${label} · ${f.properties?.count || ''} news reports in the last 24 h · pin is approximate`, links));
  });
}
let evTimer, evBusy = false;
async function loadEvents(){
  if (evBusy) return; evBusy = true; setStatus('Loading events…');
  const buf = [], flush = () => { evLayer.clearLayers(); buf.forEach(m => m.addTo(evLayer)); };
  const [q, e] = await Promise.all([getJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson'),
                                    getJSON('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=150')]);
  (q?.features || []).forEach(f => {
    const pr = f.properties, c = f.geometry.coordinates, mag = (+pr.mag || 0).toFixed(1);
    buf.push(evMarker([c[1], c[0]], evIcon('#c2571a', mag), `M${mag} · ${pr.place}`, 'Earthquake · ' + new Date(pr.time).toLocaleString(), [{href:pr.url, text:'USGS event page'}]));
  });
  (e?.events || []).forEach(ev => {
    const g = ev.geometry?.[ev.geometry.length - 1], c = g && centre(g); if (!c) return;
    const cat = ev.categories?.[0], st = EONET[cat?.id] || ['#6b7a8c', '⚠'];
    buf.push(evMarker([c[1], c[0]], evIcon(st[0], st[1]), ev.title, (cat?.title || 'Event') + ' · ' + new Date(g.date).toLocaleDateString(),
      [...(ev.sources || []).map(x => ({href:x.url, text:x.id})), {href:ev.link, text:'NASA EONET'}]));
  });
  flush();
  await gdelt('(gunman OR "mass shooting" OR "shooting suspect" OR "shot and killed" OR "police shooting" OR "active shooter")', evIcon('#d62828', GUN), 'Shooting', buf);
  flush(); setStatus(`${buf.length} events on the map (quakes, hazards, news)`);
  await new Promise(r => setTimeout(r, 5500));   // GDELT allows about one request every 5 seconds
  await gdelt('("plane crash" OR "building collapse" OR "train derailment" OR explosion OR "major accident")', evIcon('#f59e0b', '⚠'), 'Incident', buf);
  flush(); setStatus(`${buf.length} events on the map (quakes, hazards, news)`);
  evBusy = false;
}
$('#ev').onchange = e => {
  if (e.target.checked){ map.addLayer(evLayer); loadEvents(); evTimer = setInterval(loadEvents, 300000); }
  else { map.removeLayer(evLayer); clearInterval(evTimer); }
};

/* ---------- Start ---------- */
let deb; map.on('moveend', () => { clearTimeout(deb); deb = setTimeout(() => { if (Date.now() - lastPull > 3000) pull(); }, 500); });
setInterval(pull, 8000);
const m = location.hash.match(/flight=([0-9a-f]{6})/i);
(async () => {
  if (m){ try { const a = await fetchOne('hex', m[1].toLowerCase()); if (a){ upsert(a, true); go(a.hex); } } catch {} }
  pull();
})();
</script>
